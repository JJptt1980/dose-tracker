name: Mirror to killnopig.github.io/dose-tracker

# The old APK 1.0.0 (com.killnopig.dosetracker) and its on-device data live on
# the origin https://killnopig.github.io. This copies the site into the
# dose-tracker/ folder of the killnopig/killnopig.github.io user-site repo,
# laid out like pages.yml: main at the root, dev under beta/.
#
# Secret KILLNOPIG_PAGES_TOKEN: fine-grained token of the killnopig account,
# repository access limited to killnopig/killnopig.github.io, Contents: read and write.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Checkout killnopig.github.io
        uses: actions/checkout@v4
        with:
          repository: killnopig/killnopig.github.io
          token: ${{ secrets.KILLNOPIG_PAGES_TOKEN }}
          path: site

      - name: Copy site into dose-tracker/
        run: |
          mkdir -p site/dose-tracker
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'beta/' main/ site/dose-tracker/
          mkdir -p site/dose-tracker/beta
          rsync -a --delete --exclude '.git' --exclude '.github' dev/ site/dose-tracker/beta/

      - name: Commit and push
        working-directory: site
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dose-tracker
          if git diff --cached --quiet; then
            echo "No changes to mirror."
            exit 0
          fi
          git commit -m "Mirror dose-tracker ${SRC_SHA::7}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase
          done
          exit 1
